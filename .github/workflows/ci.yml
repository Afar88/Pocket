name: Pocket checks

on:
  # Run the complete suite on every branch push.
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm workspaces
        id: install_deps
        run: npm install

      - name: Build TypeScript and Next.js apps
        run: npm run build

      - name: Run agent unit tests
        if: ${{ always() && steps.install_deps.outcome == 'success' }}
        run: npm run test:agent

      - name: Install Foundry
        id: foundry
        if: ${{ always() }}
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Run PocketRegistry Foundry tests
        if: ${{ always() && steps.foundry.outcome == 'success' }}
        run: forge test

      - name: Verify committed deploy bytecode matches the forge build
        if: ${{ always() && steps.foundry.outcome == 'success' }}
        run: |
          forge build
          built=$(jq -r .bytecode.object contracts/out/PocketRegistry.sol/PocketRegistry.json)
          committed=$(cat deploy/registry.bytecode)
          if [ "$built" != "$committed" ]; then
            echo "deploy/registry.bytecode does not match the forge build output."
            exit 1
          fi

      - name: Verify committed deploy bundles match the vendored build
        if: ${{ always() && steps.install_deps.outcome == 'success' }}
        run: |
          npm run build:deploy
          git diff --exit-code deploy/bundle.js deploy/keys-bundle.js || {
            echo "Committed deploy bundles do not match the esbuild output."
            exit 1
          }
