name: Pocket checks

on:
  # Run the complete suite on every branch push.
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm workspaces
        id: install_deps
        run: npm install

      - name: Build TypeScript and Next.js apps
        run: npm run build

      - name: Run agent unit tests
        if: ${{ always() && steps.install_deps.outcome == 'success' }}
        run: npm run test:agent

      - name: Install Foundry
        id: foundry
        if: ${{ always() }}
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Run PocketRegistry Foundry tests
        if: ${{ always() && steps.foundry.outcome == 'success' }}
        run: forge test
