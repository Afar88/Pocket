services:
  - type: web
    name: pocket-web
    runtime: node
    plan: free
    buildCommand: npm install && npm run build:core && npm run build:web
    startCommand: npm run start:web
    healthCheckPath: /
    envVars:
      - key: CELO_RPC
        value: https://forno.celo.org
      - key: ATTRIBUTION_TAG
        sync: false
      - key: REGISTRY_ADDRESS
        sync: false
      - key: AGENT_ENC_PUBLIC_KEY
        sync: false
