services:
  - type: web
    name: pocket-web
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build:core && npm run build:web
    startCommand: npm run start:web
    healthCheckPath: /
    envVars:
      - key: CELO_RPC
        value: https://celo-rpc.publicnode.com
      - key: ATTRIBUTION_TAG
        sync: false
      - key: REGISTRY_ADDRESS
        sync: false

  - type: worker
    name: pocket-agent
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build:core && npm run build:agent
    startCommand: npm run start:agent
    envVars:
      - key: AGENT_PRIVATE_KEY
        sync: false
      - key: CELO_RPC
        value: https://celo-rpc.publicnode.com
      - key: ATTRIBUTION_TAG
        sync: false
      - key: REGISTRY_ADDRESS
        sync: false
